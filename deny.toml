# cargo-deny: advisories (RustSec), licenses, duplicate or wild dependencies and where crates may come from.

[advisories]
version = 2
yanked = "deny"
# An advisory that cannot be fixed yet gets an entry here with its id and the reason, never a blanket allow.
ignore = [
  # RUSTSEC-2023-0071 (Marvin attack, timing side channel in RSA *private* key operations; no fix exists). It reaches
  # the tree through `rsa`, which `jsonwebtoken` uses to verify RS256 signatures. This service only verifies, with the
  # public key, and ADR 0005 makes it refuse a private one: the vulnerable operation is never performed. `rsa` is also
  # used by the tests to make a throwaway key. Remove this entry when `rsa` has a fixed release.
  { id = "RUSTSEC-2023-0071", reason = "private-key operations only; this service verifies with the public key" },
  # RUSTSEC-2026-0387 (timing variability in crypto-bigint operations; no fix in 0.5.x, requires >=0.7.6 but jsonwebtoken 11.1.0 pins p256/p384 on 0.13 which uses crypto-bigint 0.5).
  # This service only verifies JWT signatures with public keys, so private-key operations are not performed.
  { id = "RUSTSEC-2026-0387", reason = "signature verification only with public keys; upstream jsonwebtoken is on crypto-bigint 0.5" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "Unlicense",
  "BSL-1.0",
  "MIT-0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# One crypto provider for TLS: two of them in a process make rustls refuse to pick (it panics at the first handshake).
deny = [{ crate = "aws-lc-rs" }, { crate = "aws-lc-sys" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
