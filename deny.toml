# cargo-deny: advisories (RustSec), licenses, duplicate or wild dependencies and where crates may come from.

[advisories]
version = 2
yanked = "deny"
# Nothing is ignored. An advisory that cannot be fixed yet gets an entry here with its id and the reason, never a
# blanket allow.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "Unlicense",
  "BSL-1.0",
  "MIT-0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# One crypto provider for TLS: two of them in a process make rustls refuse to pick (it panics at the first handshake).
deny = [{ crate = "aws-lc-rs" }, { crate = "aws-lc-sys" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
